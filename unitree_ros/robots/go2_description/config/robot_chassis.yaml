go2_gazebo:
  # 合并后的关节状态控制器（保留较高的发布频率）
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 1000  

  # FL Controllers ---------------------------------------
  FL_hip_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_FL_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}

  FL_thigh_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_FL_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  FL_calf_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_FL_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  # FR Controllers ---------------------------------------
