    pid: {p: 100.0, i: 0.0, d: 5.0}

  FR_thigh_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_FR_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  FR_calf_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_FR_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  # RL Controllers ---------------------------------------
