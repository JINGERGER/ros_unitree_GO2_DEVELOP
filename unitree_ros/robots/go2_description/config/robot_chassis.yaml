    type: unitree_legged_control/UnitreeJointController
    joint: dog_RL_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}

  RL_thigh_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_RL_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  RL_calf_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_RL_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  # RR Controllers ---------------------------------------
  RR_hip_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_RR_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}

  RR_thigh_controller:
    type: unitree_legged_control/UnitreeJointController
    joint: dog_RR_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  RR_calf_controller:
